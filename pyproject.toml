[project]
name = "cv_analyzer"
version = "0.1.0"
dependencies = [
    "ultralytics",
    "opencv-python",
    "pillow",
    "onvif-zeep",
    "pandas",
    "scikit-learn",
    "seaborn",
    "ipython",
    "tqdm",
    "scikit-image",
    "python-dotenv"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
